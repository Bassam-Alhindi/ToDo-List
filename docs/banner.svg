<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a0e"/>
      <stop offset="55%" stop-color="#0a131a"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e5c158"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c7d23"/>
      <stop offset="100%" stop-color="#e5c158"/>
    </linearGradient>
    <radialGradient id="dotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6e3a1"/>
      <stop offset="100%" stop-color="#9c7d23"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }

    .frame { fill: none; stroke: url(#goldGrad); stroke-width: 1.2; opacity: 0.22; }

    .blob { mix-blend-mode: screen; filter: url(#blobBlur); }
    .blob1 { fill: #1a3344; opacity: 0.4; animation: drift1 26s ease-in-out infinite alternate; }
    .blob2 { fill: #3a2f13; opacity: 0.3; animation: drift2 32s ease-in-out infinite alternate; }
    @keyframes drift1 { 0% { transform: translate(0,0); } 100% { transform: translate(60px,-20px); } }
    @keyframes drift2 { 0% { transform: translate(0,0); } 100% { transform: translate(-55px,18px); } }

    .spark { fill: #fdf6e3; opacity: 0; animation: twinkle 4.5s ease-in-out infinite; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: 1.2s; }
    .s3 { animation-delay: 2.3s; } .s4 { animation-delay: 3.2s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 0.6; transform: scale(1); }
    }

    .dot { fill: url(#dotGrad); opacity: 0; animation: floatUp 10s ease-in-out infinite; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 2.5s; }
    .d3 { animation-delay: 5s; } .d4 { animation-delay: 7.5s; }
    @keyframes floatUp {
      0%   { transform: translateY(0px); opacity: 0; }
      15%  { opacity: 0.5; }
      85%  { opacity: 0.18; }
      100% { transform: translateY(-200px); opacity: 0; }
    }

    .badge {
      fill: none;
      stroke: url(#goldGrad);
      stroke-width: 3;
      filter: url(#softGlow);
      opacity: 0;
      animation: badgeIn 0.6s ease-out 0.3s forwards;
    }
    @keyframes badgeIn { to { opacity: 0.9; } }

    .tick {
      fill: none;
      stroke: url(#goldGrad);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#glow);
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: draw 0.5s ease-out 0.9s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .title {
      font-family: 'Cairo', 'Segoe UI', Arial, sans-serif;
      font-size: 66px;
      font-weight: 800;
      fill: url(#goldGrad);
      filter: url(#glow);
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.92; }
    }

    .subtitle {
      font-family: 'Cairo', 'Segoe UI', Arial, sans-serif;
      font-size: 21px;
      fill: #cdd8de;
    }

    .barTrack { fill: #16222c; opacity: 0.8; }
    .barFill {
      fill: url(#barGrad);
      filter: url(#softGlow);
      transform: scaleX(0);
      transform-origin: 600px 0px;
      animation: fill 2.2s cubic-bezier(0.22,0.61,0.36,1) 1.1s forwards;
    }
    @keyframes fill { to { transform: scaleX(1); } }
  </style>

  <rect class="bg" width="1200" height="300"/>

  <circle class="blob blob1" cx="230" cy="80" r="150"/>
  <circle class="blob blob2" cx="970" cy="220" r="150"/>

  <g class="spark">
    <circle class="s1" cx="95"   cy="60"  r="2"/>
    <circle class="s2" cx="1110" cy="225" r="1.8"/>
    <circle class="s3" cx="1145" cy="145" r="2.2"/>
    <circle class="s4" cx="65"   cy="205" r="1.8"/>
  </g>

  <circle class="dot d1" cx="150" cy="255" r="7"/>
  <circle class="dot d2" cx="470" cy="262" r="5.5"/>
  <circle class="dot d3" cx="800" cy="256" r="6.5"/>
  <circle class="dot d4" cx="1070" cy="264" r="5"/>

  <rect class="badge" x="384" y="90" width="66" height="66" rx="18"/>
  <path class="tick" d="M 400 122 L 414 138 L 438 108"/>

  <text x="640" y="150" text-anchor="middle" class="title">قائمة المهام</text>
  <text x="600" y="195" text-anchor="middle" class="subtitle">Petrol ink, manuscript gold — Arabic RTL, zero dependencies</text>

  <rect class="barTrack" x="350" y="222" width="500" height="6" rx="3"/>
  <rect class="barFill" x="350" y="222" width="500" height="6" rx="3"/>

  <rect class="frame" x="6" y="6" width="1188" height="288" rx="18"/>
</svg>

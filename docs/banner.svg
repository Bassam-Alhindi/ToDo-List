<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a0e"/>
      <stop offset="55%" stop-color="#0a131a"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e5c158"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c7d23"/>
      <stop offset="100%" stop-color="#e5c158"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }

    .frame { fill: none; stroke: url(#goldGrad); stroke-width: 1.2; opacity: 0.22; }

    .blob { mix-blend-mode: screen; filter: url(#blobBlur); }
    .blob1 { fill: #1a3344; opacity: 0.4; animation: drift1 26s ease-in-out infinite alternate; }
    .blob2 { fill: #3a2f13; opacity: 0.3; animation: drift2 32s ease-in-out infinite alternate; }
    @keyframes drift1 { 0% { transform: translate(0,0); } 100% { transform: translate(60px,-20px); } }
    @keyframes drift2 { 0% { transform: translate(0,0); } 100% { transform: translate(-55px,18px); } }

    .badge {
      fill: none;
      stroke: url(#goldGrad);
      stroke-width: 3;
      filter: url(#softGlow);
      opacity: 0;
      animation: badgeIn 0.6s ease-out 0.3s forwards;
    }
    @keyframes badgeIn { to { opacity: 0.9; } }

    .tick {
      fill: none;
      stroke: url(#goldGrad);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#glow);
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      transform-origin: 417px 123px;
      animation: draw 4s cubic-bezier(0.34,1.56,0.64,1) infinite;
    }
    @keyframes draw {
      0%           { stroke-dashoffset: 60; transform: scale(1); }
      28%          { stroke-dashoffset: 0;  transform: scale(1); }
      34%          { stroke-dashoffset: 0;  transform: scale(1.22); }
      40%, 88%     { stroke-dashoffset: 0;  transform: scale(1); }
      96%, 100%    { stroke-dashoffset: 60; transform: scale(1); }
    }

    .ring {
      fill: none;
      stroke: url(#goldGrad);
      stroke-width: 3;
      filter: url(#softGlow);
      transform-origin: 417px 123px;
      opacity: 0;
      animation: ringPulse 4s ease-out infinite;
    }
    @keyframes ringPulse {
      0%, 30%  { opacity: 0; transform: scale(0.75); }
      36%      { opacity: 0.9; transform: scale(1); }
      58%      { opacity: 0; transform: scale(1.7); }
      100%     { opacity: 0; transform: scale(1.7); }
    }

    .spark2 { fill: url(#goldGrad); filter: url(#softGlow); }
    .spark2 circle {
      opacity: 0;
      animation: sparkBurst 4s ease-out infinite;
    }
    @keyframes sparkBurst {
      0%, 30%  { opacity: 0; transform: translateY(0); }
      38%      { opacity: 1; transform: translateY(-8px); }
      56%      { opacity: 0; transform: translateY(-26px); }
      100%     { opacity: 0; transform: translateY(-26px); }
    }

    .title {
      font-family: 'Cairo', 'Segoe UI', Arial, sans-serif;
      font-size: 66px;
      font-weight: 800;
      fill: url(#goldGrad);
      filter: url(#glow);
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.92; }
    }

    .barTrack { fill: #16222c; opacity: 0.8; }
    .barFill {
      fill: url(#barGrad);
      filter: url(#softGlow);
      transform: scaleX(0);
      transform-origin: 600px 0px;
      animation: fill 2.6s cubic-bezier(0.45,0,0.55,1) infinite alternate;
    }
    @keyframes fill { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
  </style>

  <rect class="bg" width="1200" height="300"/>

  <circle class="blob blob1" cx="230" cy="80" r="150"/>
  <circle class="blob blob2" cx="970" cy="220" r="150"/>

  <rect class="badge" x="384" y="90" width="66" height="66" rx="18"/>
  <circle class="ring" cx="417" cy="123" r="34"/>

  <g class="spark2">
    <g transform="rotate(0 417 123)"><circle cx="417" cy="93" r="2.6"/></g>
    <g transform="rotate(60 417 123)"><circle cx="417" cy="93" r="2.6"/></g>
    <g transform="rotate(120 417 123)"><circle cx="417" cy="93" r="2.6"/></g>
    <g transform="rotate(180 417 123)"><circle cx="417" cy="93" r="2.6"/></g>
    <g transform="rotate(240 417 123)"><circle cx="417" cy="93" r="2.6"/></g>
    <g transform="rotate(300 417 123)"><circle cx="417" cy="93" r="2.6"/></g>
  </g>

  <path class="tick" d="M 400 122 L 414 138 L 438 108"/>

  <text x="640" y="150" text-anchor="middle" class="title">قائمة المهام</text>

  <rect class="barTrack" x="350" y="190" width="500" height="6" rx="3"/>
  <rect class="barFill" x="350" y="190" width="500" height="6" rx="3"/>

  <rect class="frame" x="6" y="6" width="1188" height="288" rx="18"/>
</svg>

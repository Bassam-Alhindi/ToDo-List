<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a131a">
<title>مهام اليوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Reem+Kufi:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient" aria-hidden="true">
  <span class="beam"></span>
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
  <span class="orb orb-4"></span>
</div>

<div class="fx-layer" id="fx" aria-hidden="true"></div>

<main class="panel">

  <header class="panel-head">
    <h1>مهام اليوم</h1>
    <p class="today" id="todayLabel"></p>
  </header>

  <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="نسبة المهام المكتملة">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <p class="progress-note" id="taskCounter" role="status" aria-live="polite"></p>

  <form class="composer" id="composer" autocomplete="off">
    <input type="text" id="taskInput" name="task" placeholder="ما الذي تريد إنجازه؟" aria-label="مهمة جديدة">
    <div class="composer-row">
      <button type="button" class="date-pill" id="datePill" aria-haspopup="dialog" aria-expanded="false">
        <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="3"/>
          <path d="M8 3v4M16 3v4M3 10h18"/>
        </svg>
        <span id="datePillText">أضف تاريخًا</span>
      </button>
      <button type="submit" id="addBtn" aria-label="أضف المهمة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </form>

  <nav class="tabs" id="tabs" aria-label="تصفية المهام">
    <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
    <button type="button" class="tab is-active" data-filter="all" aria-pressed="true">الكل</button>
    <button type="button" class="tab" data-filter="active" aria-pressed="false">نشطة</button>
    <button type="button" class="tab" data-filter="done" aria-pressed="false">مكتملة</button>
  </nav>

  <div class="list-wrap" id="listWrap">
    <ul id="taskList"></ul>
  </div>

  <p class="empty" id="emptyMessage"></p>

  <footer class="panel-foot">
    <button type="button" id="clearCompletedBtn">امسح المكتملة</button>
  </footer>

</main>

<div class="sheet-scrim" id="sheetScrim" hidden></div>

<div class="date-sheet" id="dateSheet" role="dialog" aria-label="اختيار تاريخ الاستحقاق" hidden>
  <div class="quick" id="quickRow">
    <button type="button" class="quick-btn" data-offset="0">اليوم</button>
    <button type="button" class="quick-btn" data-offset="1">غدًا</button>
    <button type="button" class="quick-btn" data-offset="7">بعد أسبوع</button>
  </div>

  <div class="cal-head">
    <button type="button" class="cal-nav" id="calPrev" aria-label="الشهر السابق">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <span class="cal-title" id="calTitle" aria-live="polite"></span>
    <button type="button" class="cal-nav" id="calNext" aria-label="الشهر التالي">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </div>

  <div class="cal-dow" id="calDow" aria-hidden="true"></div>
  <div class="cal-grid" id="calGrid"></div>

  <div class="sheet-foot">
    <button type="button" class="date-clear" id="dateClear">بلا تاريخ</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
